services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${HOST_PORT:-18080}:80"
    environment:
      APP_ENV: docker
      SITE_URL: "http://localhost:${HOST_PORT:-18080}"
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-geo_system}
      DB_USER: ${DB_USER:-geo_user}
      DB_PASSWORD: ${DB_PASSWORD:-geo_password}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-this-secret}
      TZ: ${TZ:-Asia/Shanghai}
      AUTO_MIGRATE: "true"
      AUTO_SEED_ADMIN: "true"
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin888}
      AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
    depends_on:
      - postgres
    volumes:
      - ./:/var/www/html

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-geo_system}
      POSTGRES_USER: ${DB_USER:-geo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geo_password}
    ports:
      - "5432:5432"
    volumes:
      - geoflow_pgdata:/var/lib/postgresql/data

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["sh", "-lc", "while true; do php /var/www/html/bin/cron.php; sleep ${CRON_INTERVAL:-60}; done"]
    profiles: ["scheduler"]
    environment:
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-geo_system}
      DB_USER: ${DB_USER:-geo_user}
      DB_PASSWORD: ${DB_PASSWORD:-geo_password}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-this-secret}
      TZ: ${TZ:-Asia/Shanghai}
      AUTO_MIGRATE: "true"
      AUTO_SEED_ADMIN: "true"
    depends_on:
      - postgres
    volumes:
      - ./:/var/www/html

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["php", "/var/www/html/bin/worker.php"]
    profiles: ["scheduler"]
    environment:
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-geo_system}
      DB_USER: ${DB_USER:-geo_user}
      DB_PASSWORD: ${DB_PASSWORD:-geo_password}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-this-secret}
      TZ: ${TZ:-Asia/Shanghai}
      AUTO_MIGRATE: "true"
      AUTO_SEED_ADMIN: "true"
      AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
      CRON_INTERVAL: ${CRON_INTERVAL:-60}
    depends_on:
      - postgres
    volumes:
      - ./:/var/www/html

volumes:
  geoflow_pgdata:

